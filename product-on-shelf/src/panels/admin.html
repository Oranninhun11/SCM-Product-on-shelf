          <section data-view="admin" hidden>
            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="mb-1 flex items-center gap-2 text-sm text-muted-foreground">
                  <span class="cursor-pointer hover:text-foreground" data-nav="home">Start estimate</span>
                  <i data-lucide="chevron-right" class="h-3.5 w-3.5"></i>
                  <span class="text-foreground">Users &amp; Roles</span>
                </div>
                <h1 class="text-2xl font-semibold tracking-tight">Users &amp; Roles</h1>
              </div>
              <span class="badge badge-secondary shrink-0">Admin &middot; _RBAC</span>
            </div>

            <!-- Add / update a user -->
            <div class="card mt-6">
              <div class="card-header"><div class="card-title">Add or update a user</div>
                <div class="card-desc">Saving an email that already exists updates its role. Identity comes from Google sign-in.</div></div>
              <div class="card-content grid items-end gap-4 sm:grid-cols-2 lg:grid-cols-5">
                <div class="grid gap-1.5"><label class="label" for="adm-email">Email</label>
                  <input id="adm-email" type="email" placeholder="name@scmtechnologies.co.th" class="input" /></div>
                <div class="grid gap-1.5"><label class="label" for="adm-role">Role <span class="text-muted-foreground">(access)</span></label>
                  <select id="adm-role" class="select">
                    <option value="admin">admin</option>
                    <option value="editor">editor</option>
                    <option value="sales">sales</option>
                    <option value="viewer" selected>viewer</option>
                  </select></div>
                <div class="grid gap-1.5"><label class="label" for="adm-position">Job position</label>
                  <input id="adm-position" type="text" placeholder="e.g. Presale / Solution Architect" class="input" /></div>
                <div class="grid gap-1.5"><label class="label" for="adm-name">Name (optional)</label>
                  <input id="adm-name" type="text" class="input" /></div>
                <button id="adm-save" class="btn btn-primary">Save user</button>
              </div>
            </div>

            <div class="mt-6 flex items-center justify-between gap-2">
              <h2 class="text-lg font-semibold tracking-tight">Current users</h2>
              <button id="adm-refresh" class="btn btn-ghost btn-icon" title="Refresh" aria-label="Refresh list">
                <i data-lucide="refresh-cw" class="h-4 w-4"></i></button>
            </div>
            <div id="adm-status" class="mt-2 text-sm text-muted-foreground"></div>
            <div id="adm-table" class="mt-3 overflow-x-auto"></div>
          </section>
