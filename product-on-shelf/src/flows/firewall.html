  <!-- ===================== Firewall Replacement flow ===================== -->
  <script>
    /**
     * Phase 2 — Firewall Replacement.
     *
     * MOCK DATA + MOCK PRICING. Everything in CATALOG and PRICING below is
     * illustrative and stands in for the Phase 3 data source (Google Sheet +
     * email price-pull via the Chat webhook). Keep the pricing math in one
     * place — priceOption() — so swapping the source later is a single seam.
     */
    (function () {
      // --- Pricing source: Google Sheet (window.PRICING) when present, else mock fallback. ---
      // Phase 3 injects window.PRICING from the Sheet; the priceOption() math below is unchanged.
      var P  = window.PRICING || {};
      var PF = P.firewall || {};

      // --- Existing models the customer might be replacing (model -> Gbps) ---
      var EXISTING = PF.existing || [
        { id: 'fg-60f',    label: 'FortiGate 60F',     tp: 10 },
        { id: 'fg-100f',   label: 'FortiGate 100F',    tp: 20 },
        { id: 'fg-200f',   label: 'FortiGate 200F',    tp: 27 },
        { id: 'pa-820',    label: 'Palo Alto PA-820',  tp: 1.9 },
        { id: 'asa-5516',  label: 'Cisco ASA 5516-X',  tp: 1.8 },
        { id: 'tz570',     label: 'SonicWall TZ570',   tp: 4 },
        { id: 'srx340',    label: 'Juniper SRX340',    tp: 3 }
      ];

      // --- Replacement catalog (tp = firewall throughput Gbps; hw + annual lic, THB) ---
      var CATALOG = PF.catalog || {
        fortinet: [
          { model: 'FortiGate 70F',  tp: 10, hw: 55000,  lic: 32000 },
          { model: 'FortiGate 120G', tp: 24, hw: 120000, lic: 58000 },
          { model: 'FortiGate 200F', tp: 27, hw: 185000, lic: 78000 },
          { model: 'FortiGate 400F', tp: 37, hw: 320000, lic: 120000 },
          { model: 'FortiGate 600F', tp: 40, hw: 420000, lic: 150000 }
        ],
        paloalto: [
          { model: 'PA-410',  tp: 1.2,  hw: 65000,  lic: 42000 },
          { model: 'PA-450',  tp: 5.5,  hw: 140000, lic: 72000 },
          { model: 'PA-1410', tp: 10.6, hw: 290000, lic: 120000 },
          { model: 'PA-3410', tp: 18,   hw: 520000, lic: 190000 },
          { model: 'PA-3420', tp: 24,   hw: 680000, lic: 240000 }
        ]
      };

      var META = {
        fortinet: { name: 'Fortinet',  icon: 'shield' },
        paloalto: { name: 'Palo Alto', icon: 'shield-half' }
      };

      // --- Pricing knobs: Sheet (Knobs / Multipliers / Implementation tabs) or mock fallback ---
      var IMPL_BASE = (P.implementation && P.implementation.firewall) || { basic: 35000, standard: 75000, complex: 140000 }; // per site
      var SLA_MULT  = (P.multipliers && P.multipliers.sla)            || { nbd: 1.0, '8x5x4': 1.25, '24x7x4': 1.6 };          // on support
      var LOC_MULT  = (P.multipliers && P.multipliers.location)       || { bkk: 1.0, upcountry: 1.18 };                       // travel on impl
      var SITE_PREP = (P.knobs && P.knobs.firewall_site_prep != null) ? P.knobs.firewall_site_prep : 25000; // flat per project, hardware options only
      var BUFFER    = (P.knobs && P.knobs.buffer != null)             ? P.knobs.buffer : 1.20;               // negotiation buffer on total
      var SLA_LABEL = { nbd: 'NBD', '8x5x4': '8×5×4', '24x7x4': '24×7×4' };

      var thb    = function (n) { return '฿' + Math.round(n).toLocaleString('en-US'); };
      var round1k = function (n) { return Math.round(n / 1000) * 1000; };
      var el     = function (id) { return document.getElementById(id); };

      // Smallest model in a family that meets required throughput (else the largest).
      function pickModel(family, requiredTp) {
        var list = CATALOG[family];
        for (var i = 0; i < list.length; i++) { if (list[i].tp >= requiredTp) return list[i]; }
        return list[list.length - 1];
      }

      // The single pricing seam — replace its inputs with real data in Phase 3.
      function priceOption(family, requiredTp, inp) {
        var m = pickModel(family, requiredTp);
        var units = inp.units;
        // Only the device price scales with quantity. Implementation, support
        // and site prep are project-level — kept flat so multi-device quotes
        // don't balloon.
        var device   = m.hw * units;
        var sitePrep = (m.hw > 0 ? SITE_PREP : 0);
        var impl     = IMPL_BASE[inp.sow] * LOC_MULT[inp.location];
        var support  = m.lic * inp.years * SLA_MULT[inp.sla];
        var subtotal = device + sitePrep + impl + support;
        return {
          model: m, device: device, sitePrep: sitePrep, impl: impl, support: support,
          total: round1k(subtotal * BUFFER),
          throughput: m.tp,
          note: m.tp >= requiredTp ? 'meets sizing' : 'closest available'
        };
      }

      function readInputs() {
        return {
          model: el('fw-model').value,
          units: Math.max(1, parseInt(el('fw-units').value, 10) || 1),
          sow: el('fw-sow').value,
          years: parseInt(el('fw-years').value, 10),
          sla: el('fw-sla').value,
          location: el('fw-location').value
        };
      }

      function row(label, value) {
        return '<div class="flex justify-between"><span class="text-muted-foreground">' + label +
               '</span><span class="tabular-nums">' + value + '</span></div>';
      }

      function cardHtml(family, r, inp, recommended) {
        var hw = r.model.hw > 0;
        return '' +
          '<div class="card flex flex-col' + (recommended ? ' ring-2 ring-brand-orange' : '') + '" data-family="' + family + '">' +
            '<div class="card-header">' +
              '<div class="flex items-start justify-between gap-2">' +
                '<div class="flex items-center gap-2">' +
                  '<i data-lucide="' + META[family].icon + '" class="h-4 w-4 text-brand-navy"></i>' +
                  '<div class="card-title">' + META[family].name + '</div>' +
                '</div>' +
                (recommended ? '<span class="badge badge-brand">Best value</span>' : '') +
              '</div>' +
              '<div class="card-desc pt-0.5">' + r.model.model + '</div>' +
              '<div class="flex items-center gap-2 pt-1">' +
                '<span class="badge badge-secondary">' + r.throughput + ' Gbps</span>' +
                '<span class="text-xs text-muted-foreground">' + r.note + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="card-content flex-1 space-y-1.5 text-sm">' +
              row('Device', hw ? thb(r.device) : 'Reuse existing') +
              row('Site prep', hw ? thb(r.sitePrep) : '—') +
              row('Implementation', thb(r.impl)) +
              row('Support · ' + inp.years + ' yr · ' + SLA_LABEL[inp.sla], thb(r.support)) +
            '</div>' +
            '<div class="mt-auto flex flex-col gap-3 border-t border-border p-6 pt-4">' +
              '<div class="flex items-baseline justify-between">' +
                '<span class="text-sm text-muted-foreground">Est. total</span>' +
                '<span class="text-xl font-semibold text-brand-navy tabular-nums">' + thb(r.total) + '</span>' +
              '</div>' +
              '<button class="btn btn-primary w-full" data-select="' + family + '">Add to estimate</button>' +
            '</div>' +
          '</div>';
      }

      function render() {
        var inp = readInputs();
        var existing = EXISTING.filter(function (e) { return e.id === inp.model; })[0] || EXISTING[0];
        var requiredTp = Math.ceil(existing.tp * 1.2 * 10) / 10;

        el('fw-throughput').textContent = existing.tp + ' Gbps  →  size ≥ ' + requiredTp + ' Gbps';

        var families = ['fortinet', 'paloalto'];
        var results = families.map(function (f) { return { f: f, r: priceOption(f, requiredTp, inp) }; });
        var cheapest = results.reduce(function (a, b) { return b.r.total < a.r.total ? b : a; });

        el('fw-options').innerHTML = results.map(function (x) {
          return cardHtml(x.f, x.r, inp, x === cheapest);
        }).join('');
        lucide.createIcons();
      }

      function init() {
        // Populate existing-model dropdown from the catalog.
        el('fw-model').innerHTML = EXISTING.map(function (e) {
          return '<option value="' + e.id + '">' + e.label + ' (' + e.tp + ' Gbps)</option>';
        }).join('');

        // Recompute on any requirement change.
        document.querySelectorAll('#fw-model, #fw-units, #fw-sow, #fw-years, #fw-sla, #fw-location')
          .forEach(function (n) { n.addEventListener('input', render); });

        // Selecting an option highlights it (no estimate basket yet).
        el('fw-options').addEventListener('click', function (e) {
          var btn = e.target.closest('[data-select]');
          if (!btn) return;
          el('fw-options').querySelectorAll('[data-family]').forEach(function (c) {
            c.classList.remove('ring-2', 'ring-brand-navy');
          });
          var card = btn.closest('[data-family]');
          card.classList.remove('ring-brand-orange');
          card.classList.add('ring-2', 'ring-brand-navy');
        });

        render();
      }

      init();
    })();
  </script>
