  <!-- ===================== Firewall — Price list (Firewall ▸ Price list tab) ===================== -->
  <script>
    /**
     * Firewall price-list path: pick a FortiGate model directly from the price list
     * (no sizing), set the commercial options (units, license/MA term, SLA, advanced
     * replacement, SOW scope, site prep, location), and "Add to estimate". Lives as the
     * "Price list" tab inside the Firewall page.
     *
     * MOCK PRICING. Reuses the SAME knobs as the Firewall sizing flow — window.PRICING
     * fills them from the Sheet in Phase 3. Prices are THB.
     */
    (function () {
      var P  = window.PRICING || {};
      var PF = P.firewall || {};

      // Flat price list: hw = list price/unit, lic = annual MA/support/unit. Phase 3 fills from the Sheet.
      var PRICELIST = PF.pricelist || [
        { id: 'fg-90g',  model: 'FortiGate 90G',  price: 91000,  lic: 32000 },
        { id: 'fg-120g', model: 'FortiGate 120G', price: 121000, lic: 42000 },
        { id: 'fg-200g', model: 'FortiGate 200G', price: 201000, lic: 70000 }
      ];

      // Same commercial knobs as the sizing flow (Sheet → window.PRICING in Phase 3).
      var IMPL_BASE = (P.implementation && P.implementation.firewall) || { basic: 35000, standard: 75000, complex: 140000 };
      var SLA_MULT  = (P.multipliers && P.multipliers.sla)      || { nbd: 1.0, '8x5x4': 1.25, '24x7x4': 1.6 };
      var LOC_MULT  = (P.multipliers && P.multipliers.location) || { bkk: 1.0, upcountry: 1.18 };
      var ADV_MULT  = (P.multipliers && P.multipliers.adv_replacement != null) ? P.multipliers.adv_replacement : 1.15; // uplift on support
      var SITE_PREP = (P.knobs && P.knobs.firewall_site_prep != null) ? P.knobs.firewall_site_prep : 25000; // flat per project
      var BUFFER    = (P.knobs && P.knobs.buffer != null) ? P.knobs.buffer : 1.20;
      var SLA_LABEL = { nbd: 'NBD', '8x5x4': '8×5×4', '24x7x4': '24×7×4' };

      // Security subscription (FortiGuard bundle), priced per-device/yr as a fraction of device list — MOCK,
      // window.PRICING.firewall.tier_rate fills it from the Sheet. ATP < UTP < Enterprise (superset).
      var TIER_RATE  = PF.tier_rate || { atp: 0.28, utp: 0.35, ent: 0.50 };
      var TIER_LABEL = { atp: 'ATP Bundle', utp: 'UTP Bundle', ent: 'Enterprise Bundle' };

      var thb     = function (n) { return '฿' + Math.round(n).toLocaleString('en-US'); };
      var round1k = function (n) { return Math.round(n / 1000) * 1000; };
      var el      = function (id) { return document.getElementById(id); };

      var modelEl = el('fwl-model');
      if (!modelEl) return;             // panel not on the page
      var brandEl = el('fwl-brand');
      var sumEl = el('fwl-summary');

      // Items may carry an explicit brand; the firewall price list is Fortinet today.
      function brandOf(s) { return (s && s.brand) ? s.brand : 'Fortinet'; }
      function slugify(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

      function chosen() {
        var id = modelEl.value;
        return PRICELIST.filter(function (s) { return s.id === id; })[0] || PRICELIST[0];
      }

      function readInputs() {
        return {
          units:    Math.max(1, parseInt(el('fwl-units').value, 10) || 1),
          years:    parseInt(el('fwl-years').value, 10),
          tier:     el('fwl-tier').value,
          sla:      el('fwl-sla').value,
          sow:      el('fwl-sow').value,
          location: el('fwl-location').value,
          adv:      el('fwl-adv').checked,
          site:     el('fwl-site').checked,
          impl:     el('fwl-impl').checked,
          support:  el('fwl-support').checked
        };
      }

      // Each component is its own amount; render() folds in the checked add-ons and applies the buffer.
      function price(s, inp) {
        var device   = s.price * inp.units;                                          // device scales with qty
        var sub      = s.price * (TIER_RATE[inp.tier] || 0) * inp.units * inp.years;  // FortiGuard subscription, per device/yr
        var sitePrep = inp.site ? SITE_PREP : 0;                                     // flat per project
        var impl     = inp.impl ? IMPL_BASE[inp.sow] * LOC_MULT[inp.location] : 0;   // project-level, toggleable
        var support  = inp.support ? s.lic * inp.years * SLA_MULT[inp.sla] * (inp.adv ? ADV_MULT : 1) : 0; // FortiCare, toggleable
        return { device: device, sub: sub, sitePrep: sitePrep, impl: impl, support: support };
      }

      function row(label, value) {
        return '<div class="flex justify-between"><span class="text-muted-foreground">' + label +
               '</span><span class="tabular-nums">' + value + '</span></div>';
      }

      function render() {
        var s = chosen(), inp = readInputs(), r = price(s, inp);
        var brand = brandOf(s), slug = slugify(brand);

        // Add-ons — each ticked add-on (FortiAnalyzer / FortiManager) is its own flat line.
        var addonRows = '', addonTotal = 0;
        document.querySelectorAll('[data-fwl-addon]').forEach(function (cb) {
          if (cb.checked) { var ap = Number(cb.getAttribute('data-addon-price')) || 0; addonTotal += ap; addonRows += row(cb.getAttribute('data-addon-name'), thb(ap)); }
        });

        var subtotal = r.device + r.sub + r.sitePrep + r.impl + r.support + addonTotal;
        var total = round1k(subtotal * BUFFER);

        sumEl.innerHTML =
          '<div class="card flex flex-col" data-family="' + slug + '">' +
            '<div class="card-header">' +
              '<div class="flex items-center gap-2">' +
                '<i data-lucide="shield" class="h-4 w-4 text-brand-navy"></i>' +
                '<div class="card-title">' + brand + '</div>' +
              '</div>' +
              '<div class="card-desc pt-0.5">' + s.model + ' · ' + inp.units + ' unit' + (inp.units > 1 ? 's' : '') + '</div>' +
            '</div>' +
            '<div class="card-content flex-1 space-y-1.5 text-sm">' +
              row('Device (' + inp.units + ' × ' + thb(s.price) + ')', thb(r.device)) +
              row('Security subscription · ' + TIER_LABEL[inp.tier] + ' · ' + inp.years + ' yr', thb(r.sub)) +
              addonRows +
              row('Site prep', inp.site ? thb(r.sitePrep) : '—') +
              row('Implementation', inp.impl ? thb(r.impl) : '—') +
              row('Support · ' + inp.years + ' yr · ' + SLA_LABEL[inp.sla] + (inp.adv ? ' · Adv. RMA' : ''), inp.support ? thb(r.support) : '—') +
            '</div>' +
            '<div class="mt-auto flex flex-col gap-3 border-t border-border p-6 pt-4">' +
              '<div class="flex items-baseline justify-between">' +
                '<span class="text-sm text-muted-foreground">Est. total</span>' +
                '<span class="text-xl font-semibold text-brand-navy tabular-nums">' + thb(total) + '</span>' +
              '</div>' +
              '<button class="btn btn-primary w-full" data-select="' + slug + '">Add to estimate</button>' +
            '</div>' +
          '</div>';
        lucide.createIcons();
      }

      // Model dropdown for one brand — model name only (no price; price shows in the Quotation).
      function populateModels(brand) {
        modelEl.innerHTML = PRICELIST.filter(function (s) { return brandOf(s) === brand; })
          .map(function (s) { return '<option value="' + s.id + '">' + s.model + '</option>'; }).join('');
      }

      function init() {
        var brands = [];
        PRICELIST.forEach(function (s) { var b = brandOf(s); if (brands.indexOf(b) < 0) brands.push(b); });
        if (brandEl) {
          brandEl.innerHTML = brands.map(function (b, i) {
            return '<option value="' + b.replace(/"/g, '&quot;') + '"' + (i === 0 ? ' selected' : '') + '>' + b + '</option>';
          }).join('');
        }
        populateModels(brandEl ? brandEl.value : brands[0]);
        var nodes = document.querySelectorAll('#fwl-model, #fwl-tier, #fwl-units, #fwl-years, #fwl-sla, #fwl-sow, #fwl-location, #fwl-adv, #fwl-site, #fwl-impl, #fwl-support, [data-fwl-addon]');
        ['input', 'change'].forEach(function (evt) {
          nodes.forEach(function (n) { n.addEventListener(evt, render); });
        });
        if (brandEl) brandEl.addEventListener('change', function () { populateModels(brandEl.value); render(); });
        render();
      }

      init();
    })();
  </script>
