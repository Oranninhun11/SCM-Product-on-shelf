  <!-- ===================== Wireless (AP/WLC) — Replacement ===================== -->
  <script>
    /**
     * Wireless — Replacement. Note the existing AP generation, then choose the new Wi-Fi
     * standard and AP count for the refresh. MOCK DATA + MOCK PRICING, same window.PRICING
     * seam and pricing as the New install flow.
     */
    (function () {
      var P  = window.PRICING || {};
      var PX = P.wireless || {};
      var AP = PX.ap || {
        cisco: { wifi6: { model: 'Catalyst 9120AXI', hw: 32000 }, wifi6e: { model: 'Catalyst 9136', hw: 48000 }, wifi7: { model: 'Catalyst CW9176', hw: 62000 } },
        aruba: { wifi6: { model: 'AP-535', hw: 28000 },          wifi6e: { model: 'AP-635', hw: 42000 },        wifi7: { model: 'AP-735', hw: 58000 } }
      };
      var CONTROLLER = PX.controller || { cisco: { model: 'Catalyst 9800-L', hw: 220000 }, aruba: { model: '7030 Mobility Controller', hw: 160000 } };
      var LIC_CTRL   = PX.lic_ctrl  || { cisco: 1800, aruba: 1400 };
      var LIC_CLOUD  = PX.lic_cloud || { cisco: 2600, aruba: 2100 };
      var META       = { cisco: { name: 'Cisco', icon: 'wifi' }, aruba: { name: 'Aruba', icon: 'radio' } };
      var WIFI_LABEL = { wifi6: 'Wi-Fi 6', wifi6e: 'Wi-Fi 6E', wifi7: 'Wi-Fi 7' };
      var EXISTING = PX.existing || [
        { id: 'air2802', label: 'Cisco Aironet 2802 (Wi-Fi 5)', det: 'Wi-Fi 5' },
        { id: 'cat9115', label: 'Cisco Catalyst 9115 (Wi-Fi 6)', det: 'Wi-Fi 6' },
        { id: 'ap315',   label: 'Aruba AP-315 (Wi-Fi 5)',        det: 'Wi-Fi 5' },
        { id: 'ap515',   label: 'Aruba AP-515 (Wi-Fi 6)',        det: 'Wi-Fi 6' }
      ];
      var IMPL_BASE  = (P.implementation && P.implementation.wireless) || { basic: 50000, standard: 120000, complex: 240000 };
      var SLA_MULT   = (P.multipliers && P.multipliers.sla)      || { nbd: 1.0, '8x5x4': 1.25, '24x7x4': 1.6 };
      var LOC_MULT   = (P.multipliers && P.multipliers.location) || { bkk: 1.0, upcountry: 1.18 };
      var SLA_LABEL  = { nbd: 'NBD', '8x5x4': '8×5×4', '24x7x4': '24×7×4' };
      var BUFFER     = (P.knobs && P.knobs.buffer != null) ? P.knobs.buffer : 1.20;
      var thb = function (n) { return '฿' + Math.round(n).toLocaleString('en-US'); };
      var round1k = function (n) { return Math.round(n / 1000) * 1000; };
      var el = function (id) { return document.getElementById(id); };

      var modelEl = el('wlr-model');
      if (!modelEl) return;
      function existing() { var id = modelEl.value; return EXISTING.filter(function (e) { return e.id === id; })[0] || EXISTING[0]; }

      function priceOption(family, inp) {
        var ap = AP[family][inp.wifi];
        var devices = ap.hw * inp.aps;
        var isCtrl = inp.mgmt === 'controller';
        var ctrlHw = isCtrl ? CONTROLLER[family].hw : 0;
        var perAp  = isCtrl ? LIC_CTRL[family] : LIC_CLOUD[family];
        var licSup = perAp * inp.aps * inp.years * SLA_MULT[inp.sla];
        var impl   = IMPL_BASE[inp.sow] * LOC_MULT[inp.location];
        return { ap: ap, devices: devices, ctrlHw: ctrlHw, licSup: licSup, impl: impl, total: round1k((devices + ctrlHw + licSup + impl) * BUFFER) };
      }
      function readInputs() {
        return { aps: Math.max(1, parseInt(el('wlr-aps').value, 10) || 1), wifi: el('wlr-wifi').value, mgmt: el('wlr-mgmt').value,
                 sow: el('wlr-sow').value, years: parseInt(el('wlr-years').value, 10), sla: el('wlr-sla').value, location: el('wlr-location').value };
      }
      function row(label, value) { return '<div class="flex justify-between"><span class="text-muted-foreground">' + label + '</span><span class="tabular-nums">' + value + '</span></div>'; }
      function cardHtml(family, r, inp, recommended) {
        var mgmtLabel = inp.mgmt === 'controller' ? CONTROLLER[family].model : 'Cloud-managed';
        return '<div class="card flex flex-col' + (recommended ? ' ring-2 ring-brand-orange' : '') + '" data-vendor="' + family + '">' +
          '<div class="card-header"><div class="flex items-start justify-between gap-2"><div class="flex items-center gap-2">' +
          '<i data-lucide="' + META[family].icon + '" class="h-4 w-4 text-brand-navy"></i><div class="card-title">' + META[family].name + '</div></div>' +
          (recommended ? '<span class="badge badge-brand">Best value</span>' : '') + '</div>' +
          '<div class="card-desc pt-0.5">' + r.ap.model + ' · ' + mgmtLabel + '</div>' +
          '<div class="flex items-center gap-2 pt-1"><span class="badge badge-secondary">' + inp.aps + ' APs</span>' +
          '<span class="text-xs text-muted-foreground">' + WIFI_LABEL[inp.wifi] + '</span></div></div>' +
          '<div class="card-content flex-1 space-y-1.5 text-sm">' +
          row('Access points (' + inp.aps + '×)', thb(r.devices)) +
          row('Controller / mgmt', inp.mgmt === 'controller' ? thb(r.ctrlHw) : 'Cloud-managed') +
          row('Licenses + support · ' + inp.years + ' yr · ' + SLA_LABEL[inp.sla], thb(r.licSup)) +
          row('Implementation', thb(r.impl)) + '</div>' +
          '<div class="mt-auto flex flex-col gap-3 border-t border-border p-6 pt-4"><div class="flex items-baseline justify-between">' +
          '<span class="text-sm text-muted-foreground">Est. total</span><span class="text-xl font-semibold text-brand-navy tabular-nums">' + thb(r.total) + '</span></div>' +
          '<button class="btn btn-primary w-full" data-select="' + family + '">Add to estimate</button></div></div>';
      }
      function render() {
        var inp = readInputs();
        el('wlr-detected').textContent = 'existing ' + existing().det;
        var families = ['cisco', 'aruba'];
        var results = families.map(function (f) { return { f: f, r: priceOption(f, inp) }; });
        var cheapest = results.reduce(function (a, b) { return b.r.total < a.r.total ? b : a; });
        el('wlr-options').innerHTML = results.map(function (x) { return cardHtml(x.f, x.r, inp, x === cheapest); }).join('');
        lucide.createIcons();
      }
      function init() {
        modelEl.innerHTML = EXISTING.map(function (e) { return '<option value="' + e.id + '">' + e.label + '</option>'; }).join('');
        document.querySelectorAll('#wlr-model, #wlr-aps, #wlr-wifi, #wlr-mgmt, #wlr-sow, #wlr-years, #wlr-sla, #wlr-location')
          .forEach(function (n) { n.addEventListener('input', render); });
        render();
      }
      init();
    })();
  </script>
