  <!-- ===================== Router / SD-WAN flow ===================== -->
  <script>
    /**
     * Router / SD-WAN. MOCK DATA + MOCK PRICING. One edge device per site (model by bandwidth tier),
     * plus a per-site SD-WAN license + support subscription. priceOption() is the single seam.
     */
    (function () {
      // --- Pricing source: window.PRICING (Sheet) when present, else mock fallback. ---
      var P  = window.PRICING || {};
      var PX = P.router || {};

      var CATALOG = PX.catalog || {
        fortinet: { low: { model: 'FortiGate 40F', hw: 22000 }, mid: { model: 'FortiGate 80F', hw: 45000 }, high: { model: 'FortiGate 100F', hw: 95000 } },
        cisco:    { low: { model: 'Meraki MX68', hw: 28000 },   mid: { model: 'Meraki MX85', hw: 60000 },   high: { model: 'Meraki MX95', hw: 120000 } }
      };
      var META = { fortinet: { name: 'Fortinet Secure SD-WAN', icon: 'route' }, cisco: { name: 'Cisco Meraki SD-WAN', icon: 'route' } };
      var SDWAN_YR = PX.sdwan_yr || { fortinet: 9000, cisco: 14000 };  // per site per year (license + support)
      var BW_LABEL = { low: '≤100 Mbps', mid: '≤500 Mbps', high: '≤1 Gbps' };
      var IMPL_BASE = (P.implementation && P.implementation.router) || { basic: 30000, standard: 70000, complex: 150000 };
      var SLA_MULT = (P.multipliers && P.multipliers.sla)      || { nbd: 1.0, '8x5x4': 1.25, '24x7x4': 1.6 };
      var LOC_MULT = (P.multipliers && P.multipliers.location) || { bkk: 1.0, upcountry: 1.18 };
      var SLA_LABEL = { nbd: 'NBD', '8x5x4': '8×5×4', '24x7x4': '24×7×4' };
      var BUFFER = (P.knobs && P.knobs.buffer != null) ? P.knobs.buffer : 1.20;
      var thb = function (n) { return '฿' + Math.round(n).toLocaleString('en-US'); };
      var round1k = function (n) { return Math.round(n / 1000) * 1000; };
      var el = function (id) { return document.getElementById(id); };

      function priceOption(family, inp) {
        var m = CATALOG[family][inp.bw];
        var device = m.hw * inp.sites;
        var lic = SDWAN_YR[family] * inp.sites * inp.years * SLA_MULT[inp.sla];
        var impl = IMPL_BASE[inp.sow] * LOC_MULT[inp.location];
        return { model: m.model, device: device, lic: lic, impl: impl, total: round1k((device + lic + impl) * BUFFER) };
      }
      function readInputs() {
        return { sites: Math.max(1, parseInt(el('rtr-sites').value, 10) || 1), bw: el('rtr-bw').value,
                 sow: el('rtr-sow').value, years: parseInt(el('rtr-years').value, 10), sla: el('rtr-sla').value, location: el('rtr-location').value };
      }
      function row(label, value) { return '<div class="flex justify-between"><span class="text-muted-foreground">' + label + '</span><span class="tabular-nums">' + value + '</span></div>'; }
      function cardHtml(family, r, inp, recommended) {
        return '<div class="card flex flex-col' + (recommended ? ' ring-2 ring-brand-orange' : '') + '" data-vendor="' + family + '">' +
          '<div class="card-header"><div class="flex items-start justify-between gap-2"><div class="flex items-center gap-2">' +
          '<i data-lucide="' + META[family].icon + '" class="h-4 w-4 text-brand-navy"></i><div class="card-title">' + META[family].name + '</div></div>' +
          (recommended ? '<span class="badge badge-brand">Best value</span>' : '') + '</div>' +
          '<div class="card-desc pt-0.5">' + r.model + ' × ' + inp.sites + '</div>' +
          '<div class="flex items-center gap-2 pt-1"><span class="badge badge-secondary">' + inp.sites + ' devices</span>' +
          '<span class="text-xs text-muted-foreground">' + BW_LABEL[inp.bw] + '</span></div></div>' +
          '<div class="card-content flex-1 space-y-1.5 text-sm">' +
          row('Edge devices (' + inp.sites + ')', thb(r.device)) +
          row('SD-WAN license + support · ' + inp.years + ' yr · ' + SLA_LABEL[inp.sla], thb(r.lic)) +
          row('Implementation', thb(r.impl)) + '</div>' +
          '<div class="mt-auto flex flex-col gap-3 border-t border-border p-6 pt-4"><div class="flex items-baseline justify-between">' +
          '<span class="text-sm text-muted-foreground">Est. total</span><span class="text-xl font-semibold text-brand-navy tabular-nums">' + thb(r.total) + '</span></div>' +
          '<button class="btn btn-primary w-full" data-select="' + family + '">Add to estimate</button></div></div>';
      }
      function render() {
        var inp = readInputs();
        el('rtr-sizing').innerHTML = '<div class="rounded-md border border-border bg-card px-4 py-2.5 text-sm"><span class="font-medium tabular-nums">' +
          inp.sites + ' devices</span><span class="text-muted-foreground"> · ' + BW_LABEL[inp.bw] + ' · SD-WAN</span></div>';
        var families = ['fortinet', 'cisco'];
        var results = families.map(function (f) { return { f: f, r: priceOption(f, inp) }; });
        var cheapest = results.reduce(function (a, b) { return b.r.total < a.r.total ? b : a; });
        el('rtr-options').innerHTML = results.map(function (x) { return cardHtml(x.f, x.r, inp, x === cheapest); }).join('');
        lucide.createIcons();
      }
      function init() {
        document.querySelectorAll('#rtr-sites, #rtr-bw, #rtr-sow, #rtr-years, #rtr-sla, #rtr-location')
          .forEach(function (n) { n.addEventListener('input', render); });
        render();
      }
      init();
    })();
  </script>
