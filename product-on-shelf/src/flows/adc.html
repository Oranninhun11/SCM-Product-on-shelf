  <!-- ===================== Load balancer / ADC flow ===================== -->
  <script>
    /**
     * Load balancer / ADC. MOCK DATA + MOCK PRICING. Appliance by throughput tier, ×2 for an HA pair;
     * support is a fraction of hardware per year. priceOption() is the single seam.
     */
    (function () {
      // --- Pricing source: window.PRICING (Sheet) when present, else mock fallback. ---
      var P  = window.PRICING || {};
      var PX = P.adc || {};

      var CATALOG = PX.catalog || {
        f5:     { low: { model: 'BIG-IP r2600', hw: 380000 }, mid: { model: 'BIG-IP r4600', hw: 650000 }, high: { model: 'BIG-IP r5600', hw: 1100000 } },
        citrix: { low: { model: 'NetScaler MPX 5901', hw: 320000 }, mid: { model: 'NetScaler MPX 8905', hw: 580000 }, high: { model: 'NetScaler MPX 8920', hw: 980000 } }
      };
      var META = { f5: { name: 'F5 BIG-IP', icon: 'scale' }, citrix: { name: 'Citrix NetScaler', icon: 'scale' } };
      var SUPPORT_RATE = PX.support_rate || { f5: 0.18, citrix: 0.16 };  // per year, fraction of appliance
      var TP_LABEL = { low: '≤5 Gbps', mid: '≤10 Gbps', high: '≤20 Gbps' };
      var IMPL_BASE = (P.implementation && P.implementation.adc) || { basic: 60000, standard: 130000, complex: 260000 };
      var SLA_MULT = (P.multipliers && P.multipliers.sla)      || { nbd: 1.0, '8x5x4': 1.25, '24x7x4': 1.6 };
      var LOC_MULT = (P.multipliers && P.multipliers.location) || { bkk: 1.0, upcountry: 1.18 };
      var SLA_LABEL = { nbd: 'NBD', '8x5x4': '8×5×4', '24x7x4': '24×7×4' };
      var BUFFER = (P.knobs && P.knobs.buffer != null) ? P.knobs.buffer : 1.20;
      var thb = function (n) { return '฿' + Math.round(n).toLocaleString('en-US'); };
      var round1k = function (n) { return Math.round(n / 1000) * 1000; };
      var el = function (id) { return document.getElementById(id); };

      function priceOption(family, inp) {
        var m = CATALOG[family][inp.tp];
        var ha = inp.deploy === 'ha' ? 2 : 1;
        var qty = ha * inp.units;                              // total appliances = HA factor × device count
        var device = m.hw * qty;
        var support = device * SUPPORT_RATE[family] * inp.years * SLA_MULT[inp.sla];
        var impl = IMPL_BASE[inp.sow] * LOC_MULT[inp.location];
        return { model: m.model, ha: ha, qty: qty, device: device, support: support, impl: impl, total: round1k((device + support + impl) * BUFFER) };
      }
      function readInputs() {
        return { tp: el('adc-tp').value, units: Math.max(1, parseInt(el('adc-units').value, 10) || 1), deploy: el('adc-deploy').value, sow: el('adc-sow').value,
                 years: parseInt(el('adc-years').value, 10), sla: el('adc-sla').value, location: el('adc-location').value };
      }
      function row(label, value) { return '<div class="flex justify-between"><span class="text-muted-foreground">' + label + '</span><span class="tabular-nums">' + value + '</span></div>'; }
      function cardHtml(family, r, inp, recommended) {
        return '<div class="card flex flex-col' + (recommended ? ' ring-2 ring-brand-orange' : '') + '" data-vendor="' + family + '">' +
          '<div class="card-header"><div class="flex items-start justify-between gap-2"><div class="flex items-center gap-2">' +
          '<i data-lucide="' + META[family].icon + '" class="h-4 w-4 text-brand-navy"></i><div class="card-title">' + META[family].name + '</div></div>' +
          (recommended ? '<span class="badge badge-brand">Best value</span>' : '') + '</div>' +
          '<div class="card-desc pt-0.5">' + r.model + (r.qty > 1 ? ' ×' + r.qty : '') + (r.ha > 1 ? ' (HA pair)' : '') + '</div>' +
          '<div class="flex items-center gap-2 pt-1"><span class="badge badge-secondary">' + TP_LABEL[inp.tp] + '</span>' +
          '<span class="text-xs text-muted-foreground">' + inp.units + ' × ' + (r.ha > 1 ? 'HA pair' : 'single') + '</span></div></div>' +
          '<div class="card-content flex-1 space-y-1.5 text-sm">' +
          row('Appliance' + (r.qty > 1 ? ' (' + r.qty + '×)' : ''), thb(r.device)) +
          row('Support · ' + inp.years + ' yr · ' + SLA_LABEL[inp.sla], thb(r.support)) +
          row('Implementation', thb(r.impl)) + '</div>' +
          '<div class="mt-auto flex flex-col gap-3 border-t border-border p-6 pt-4"><div class="flex items-baseline justify-between">' +
          '<span class="text-sm text-muted-foreground">Est. total</span><span class="text-xl font-semibold text-brand-navy tabular-nums">' + thb(r.total) + '</span></div>' +
          '<button class="btn btn-primary w-full" data-select="' + family + '">Add to estimate</button></div></div>';
      }
      function render() {
        var inp = readInputs();
        el('adc-sizing').innerHTML = '<div class="rounded-md border border-border bg-card px-4 py-2.5 text-sm"><span class="font-medium tabular-nums">' +
          inp.units + ' × ' + TP_LABEL[inp.tp] + '</span><span class="text-muted-foreground"> · ' + (inp.deploy === 'ha' ? 'HA pair' : 'single appliance') + '</span></div>';
        var families = ['f5', 'citrix'];
        var results = families.map(function (f) { return { f: f, r: priceOption(f, inp) }; });
        var cheapest = results.reduce(function (a, b) { return b.r.total < a.r.total ? b : a; });
        el('adc-options').innerHTML = results.map(function (x) { return cardHtml(x.f, x.r, inp, x === cheapest); }).join('');
        lucide.createIcons();
      }
      function init() {
        document.querySelectorAll('#adc-tp, #adc-units, #adc-deploy, #adc-sow, #adc-years, #adc-sla, #adc-location')
          .forEach(function (n) { n.addEventListener('input', render); });
        render();
      }
      init();
    })();
  </script>
