  <!-- ===================== Standalone Server flow ===================== -->
  <script>
    /**
     * Standalone (non-HCI) rack servers. MOCK DATA + MOCK PRICING. Per-server price = chassis/CPU
     * base (by socket count) + RAM + local disk, scaled by quantity; support flat per server.
     * priceOption() is the single seam.
     */
    (function () {
      // --- Pricing source: window.PRICING (Sheet) when present, else mock fallback. ---
      var P  = window.PRICING || {};
      var PX = P.server || {};

      var BASE = PX.base || {
        dell: { 1: { model: 'PowerEdge R660', hw: 180000 }, 2: { model: 'PowerEdge R760', hw: 280000 } },
        hpe:  { 1: { model: 'ProLiant DL360 Gen11', hw: 175000 }, 2: { model: 'ProLiant DL380 Gen11', hw: 275000 } }
      };
      var META = { dell: { name: 'Dell PowerEdge', icon: 'server' }, hpe: { name: 'HPE ProLiant', icon: 'server' } };
      var RAM_RATE = (P.knobs && P.knobs.server_ram_rate != null) ? P.knobs.server_ram_rate : 900,
          DISK_RATE = (P.knobs && P.knobs.server_disk_rate != null) ? P.knobs.server_disk_rate : 9000;  // THB per GB RAM / per TB disk
      var SUPPORT_YR = PX.support_yr || { dell: 22000, hpe: 21000 };    // per server per year
      var IMPL_BASE = (P.implementation && P.implementation.server) || { basic: 40000, standard: 90000, complex: 180000 };
      var SLA_MULT = (P.multipliers && P.multipliers.sla)      || { nbd: 1.0, '8x5x4': 1.25, '24x7x4': 1.6 };
      var LOC_MULT = (P.multipliers && P.multipliers.location) || { bkk: 1.0, upcountry: 1.18 };
      var SLA_LABEL = { nbd: 'NBD', '8x5x4': '8×5×4', '24x7x4': '24×7×4' };
      var BUFFER = (P.knobs && P.knobs.buffer != null) ? P.knobs.buffer : 1.20;
      var thb = function (n) { return '฿' + Math.round(n).toLocaleString('en-US'); };
      var round1k = function (n) { return Math.round(n / 1000) * 1000; };
      var el = function (id) { return document.getElementById(id); };

      function priceOption(family, inp) {
        var b = BASE[family][inp.sockets];
        var perServer = b.hw + inp.ram * RAM_RATE + inp.disk * DISK_RATE;
        var device = perServer * inp.qty;
        var support = SUPPORT_YR[family] * inp.qty * inp.years * SLA_MULT[inp.sla];
        var impl = IMPL_BASE[inp.sow] * LOC_MULT[inp.location];
        return { model: b.model, device: device, support: support, impl: impl, total: round1k((device + support + impl) * BUFFER) };
      }
      function readInputs() {
        return { qty: Math.max(1, parseInt(el('srv-qty').value, 10) || 1), sockets: el('srv-sockets').value,
                 ram: Math.max(1, parseInt(el('srv-ram').value, 10) || 1), disk: Math.max(1, parseFloat(el('srv-disk').value) || 1),
                 sow: el('srv-sow').value, years: parseInt(el('srv-years').value, 10), sla: el('srv-sla').value, location: el('srv-location').value };
      }
      function row(label, value) { return '<div class="flex justify-between"><span class="text-muted-foreground">' + label + '</span><span class="tabular-nums">' + value + '</span></div>'; }
      function cardHtml(family, r, inp, recommended) {
        return '<div class="card flex flex-col' + (recommended ? ' ring-2 ring-brand-orange' : '') + '" data-vendor="' + family + '">' +
          '<div class="card-header"><div class="flex items-start justify-between gap-2"><div class="flex items-center gap-2">' +
          '<i data-lucide="' + META[family].icon + '" class="h-4 w-4 text-brand-navy"></i><div class="card-title">' + META[family].name + '</div></div>' +
          (recommended ? '<span class="badge badge-brand">Best value</span>' : '') + '</div>' +
          '<div class="card-desc pt-0.5">' + r.model + '</div>' +
          '<div class="flex items-center gap-2 pt-1"><span class="badge badge-secondary">' + inp.qty + ' × ' + inp.sockets + 'S</span>' +
          '<span class="text-xs text-muted-foreground">' + inp.ram + 'GB · ' + inp.disk + 'TB ea</span></div></div>' +
          '<div class="card-content flex-1 space-y-1.5 text-sm">' +
          row('Servers (' + inp.qty + '×)', thb(r.device)) +
          row('Support · ' + inp.years + ' yr · ' + SLA_LABEL[inp.sla], thb(r.support)) +
          row('Implementation', thb(r.impl)) + '</div>' +
          '<div class="mt-auto flex flex-col gap-3 border-t border-border p-6 pt-4"><div class="flex items-baseline justify-between">' +
          '<span class="text-sm text-muted-foreground">Est. total</span><span class="text-xl font-semibold text-brand-navy tabular-nums">' + thb(r.total) + '</span></div>' +
          '<button class="btn btn-primary w-full" data-select="' + family + '">Add to estimate</button></div></div>';
      }
      function render() {
        var inp = readInputs();
        el('srv-sizing').innerHTML = '<div class="rounded-md border border-border bg-card px-4 py-2.5 text-sm"><span class="font-medium tabular-nums">' +
          inp.qty + ' × ' + inp.sockets + '-socket</span><span class="text-muted-foreground"> · ' + inp.ram + ' GB · ' + inp.disk + ' TB each</span></div>';
        var families = ['dell', 'hpe'];
        var results = families.map(function (f) { return { f: f, r: priceOption(f, inp) }; });
        var cheapest = results.reduce(function (a, b) { return b.r.total < a.r.total ? b : a; });
        el('srv-options').innerHTML = results.map(function (x) { return cardHtml(x.f, x.r, inp, x === cheapest); }).join('');
        lucide.createIcons();
      }
      function init() {
        document.querySelectorAll('#srv-qty, #srv-sockets, #srv-ram, #srv-disk, #srv-sow, #srv-years, #srv-sla, #srv-location')
          .forEach(function (n) { n.addEventListener('input', render); });
        render();
      }
      init();
    })();
  </script>
