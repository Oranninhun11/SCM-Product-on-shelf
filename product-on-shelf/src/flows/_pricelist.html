  <!-- ===================== Generic price-list engine (shared) ===================== -->
  <script>
    /**
     * One engine drives the "Price list" tab on every product (except Firewall, which has
     * its own richer flow in fwlist.html). Each product panel has a
     * <div data-pricelist="<view>"></div> mount; we fill it with a full set of commercial
     * options and an itemized, cart-ready Quotation card — the SAME shape the Firewall
     * price-list tab uses, so a switch quote reads like a firewall quote.
     *
     * Two layouts, chosen by item type:
     *   • HARDWARE (subscription=false, not flagged sw) — Device · Site prep · Implementation ·
     *     Support·N yr·SLA. Options: Units, License/MA term, SLA tier, SOW scope, Location,
     *     Advanced replacement (RMA), Include site preparation.
     *   • SOFTWARE (subscription=true, or flagged sw:true like Windows Server) — License ·
     *     [Term] · Onboarding · Support (included). Options: Quantity, [Term], SOW scope
     *     (onboarding), Location.
     *
     * SKUs come from window.PRICING[view].pricelist when present (Phase 3 / Sheet), else the
     * mock DEFAULTS below. Commercial knobs (implementation base, SLA/location multipliers,
     * site prep, buffer) reuse the SAME window.PRICING seams as the sizing flows. MOCK PRICING.
     *
     * Item shape: { model, price, unit }. Product config: { label, icon, qtyLabel, subscription, sw }.
     * subscription=true → price is per-unit-per-year and a Term (1/3/5 yr) control appears.
     * sw=true → software layout even though one-time (perpetual licenses, e.g. Windows Server).
     */
    (function () {
      var P = window.PRICING || {};
      var BUFFER = (P.knobs && P.knobs.buffer != null) ? P.knobs.buffer : 1.20;
      var thb = function (n) { return '฿' + Math.round(n).toLocaleString('en-US'); };
      var round1k = function (n) { return Math.round(n / 1000) * 1000; };

      // ---- Shared commercial knobs (identical seams to the sizing flows / fwlist) ----
      var SLA_MULT  = (P.multipliers && P.multipliers.sla)      || { nbd: 1.0, '8x5x4': 1.25, '24x7x4': 1.6 };
      var LOC_MULT  = (P.multipliers && P.multipliers.location) || { bkk: 1.0, upcountry: 1.18 };
      var ADV_MULT  = (P.multipliers && P.multipliers.adv_replacement != null) ? P.multipliers.adv_replacement : 1.15; // uplift on support
      var SITE_PREP = (P.knobs && P.knobs.pricelist_site_prep != null) ? P.knobs.pricelist_site_prep : 25000;          // flat per project
      var SUPP_RATE = (P.knobs && P.knobs.support_rate != null) ? P.knobs.support_rate : 0.10;                         // annual HW maintenance ≈ 10% of list (matches switch/storage lic ratios)
      var SLA_LABEL = { nbd: 'NBD', '8x5x4': '8×5×4', '24x7x4': '24×7×4' };

      // Per-category implementation base (mirrors the sizing flows; Sheet fills P.implementation[key]).
      var IMPL_DEFAULT = {
        router:   { basic: 30000, standard: 70000,  complex: 150000 }, switch:  { basic: 25000, standard: 55000,  complex: 110000 },
        adc:      { basic: 60000, standard: 130000, complex: 260000 }, wireless:{ basic: 50000, standard: 120000, complex: 240000 },
        server:   { basic: 40000, standard: 90000,  complex: 180000 }, storage: { basic: 60000, standard: 120000, complex: 240000 },
        ups:      { basic: 30000, standard: 70000,  complex: 150000 }, hci:     { basic: 80000, standard: 160000, complex: 320000 },
        // software onboarding (lighter than hardware install)
        ws:       { basic: 12000, standard: 30000,  complex: 60000  }, m365:    { basic: 15000, standard: 40000,  complex: 90000  },
        virt:     { basic: 25000, standard: 60000,  complex: 120000 }, backup:  { basic: 20000, standard: 50000,  complex: 100000 },
        endpoint: { basic: 15000, standard: 40000,  complex: 90000  }, nac:     { basic: 30000, standard: 80000,  complex: 160000 },
        dlp:      { basic: 25000, standard: 60000,  complex: 120000 }, esec:    { basic: 15000, standard: 40000,  complex: 90000  },
        captive:  { basic: 20000, standard: 45000,  complex: 90000  }, siem:    { basic: 40000, standard: 90000,  complex: 180000 }
      };
      var IMPL_GENERIC = { basic: 35000, standard: 75000, complex: 140000 };
      function implFor(key) { return (P.implementation && P.implementation[key]) || IMPL_DEFAULT[key] || IMPL_GENERIC; }

      var HW_SOW = { basic: 'Basic — install & base config', standard: 'Standard — config + integration', complex: 'Complex — full redesign + HA' };
      var SW_SOW = { basic: 'Basic — onboarding',            standard: 'Standard — config + integration', complex: 'Complex — full rollout + integration' };

      var DEFAULTS = {
        // ---- Hardware: one-time price per unit ----
        router: { label: 'Router / SD-WAN', icon: 'route', qtyLabel: 'Units', subscription: false, items: [
          { model: 'FortiGate 40F', price: 22000, unit: 'each' }, { model: 'FortiGate 80F', price: 45000, unit: 'each' }, { model: 'FortiGate 100F', price: 95000, unit: 'each' },
          { model: 'Meraki MX68', price: 28000, unit: 'each' }, { model: 'Meraki MX85', price: 60000, unit: 'each' }, { model: 'Meraki MX95', price: 120000, unit: 'each' } ] },
        switch: { label: 'Network Switch', icon: 'network', qtyLabel: 'Units', subscription: false, items: [
          { model: 'Cisco C9200L-24P', price: 95000, unit: 'each' }, { model: 'Cisco C9200L-48P', price: 155000, unit: 'each' },
          { model: 'Aruba CX 6300M-24', price: 78000, unit: 'each' }, { model: 'Aruba CX 6300M-48', price: 135000, unit: 'each' } ] },
        adc: { label: 'Load balancer / ADC', icon: 'scale', qtyLabel: 'Units', subscription: false, items: [
          { model: 'F5 BIG-IP r2600', price: 380000, unit: 'each' }, { model: 'F5 BIG-IP r4600', price: 650000, unit: 'each' }, { model: 'F5 BIG-IP r5600', price: 1100000, unit: 'each' },
          { model: 'Citrix MPX 5901', price: 320000, unit: 'each' }, { model: 'Citrix MPX 8905', price: 580000, unit: 'each' }, { model: 'Citrix MPX 8920', price: 980000, unit: 'each' } ] },
        wireless: { label: 'Wireless (AP/WLC)', icon: 'wifi', qtyLabel: 'Access points', subscription: false, items: [
          { model: 'Cisco Catalyst 9120AXI', price: 32000, unit: 'per AP' }, { model: 'Cisco Catalyst 9136', price: 48000, unit: 'per AP' }, { model: 'Cisco Catalyst CW9176', price: 62000, unit: 'per AP' },
          { model: 'Aruba AP-535', price: 28000, unit: 'per AP' }, { model: 'Aruba AP-635', price: 42000, unit: 'per AP' }, { model: 'Aruba AP-735', price: 58000, unit: 'per AP' } ] },
        hci: { label: 'Server / HCI', icon: 'server', qtyLabel: 'Nodes', subscription: false, items: [
          { model: 'Nutanix NX-3155-G9', price: 1150000, unit: 'per node (hw)' }, { model: 'Supermicro SYS-2125H (Proxmox)', price: 720000, unit: 'per node (hw)' } ] },
        server: { label: 'Standalone Server', icon: 'cpu', qtyLabel: 'Servers', subscription: false, items: [
          { model: 'Dell PowerEdge R660', price: 180000, unit: 'base config' }, { model: 'Dell PowerEdge R760', price: 280000, unit: 'base config' },
          { model: 'HPE ProLiant DL360 Gen11', price: 175000, unit: 'base config' }, { model: 'HPE ProLiant DL380 Gen11', price: 275000, unit: 'base config' } ] },
        storage: { label: 'Storage', icon: 'hard-drive', qtyLabel: 'Arrays', subscription: false, items: [
          { model: 'Dell PowerStore 500T', price: 850000, unit: 'per array' }, { model: 'Dell PowerStore 1200T', price: 1500000, unit: 'per array' }, { model: 'Dell PowerStore 3200T', price: 2600000, unit: 'per array' },
          { model: 'NetApp AFF A250', price: 780000, unit: 'per array' }, { model: 'NetApp AFF A400', price: 1650000, unit: 'per array' }, { model: 'NetApp AFF A800', price: 2900000, unit: 'per array' } ] },
        ups: { label: 'UPS / Power', icon: 'battery-charging', qtyLabel: 'Units', subscription: false, items: [
          { model: 'APC Smart-UPS SRT 3000', price: 65000, unit: 'each' }, { model: 'APC Smart-UPS SRT 6000', price: 120000, unit: 'each' }, { model: 'APC Symmetra 10kVA', price: 280000, unit: 'each' }, { model: 'APC Symmetra 20kVA', price: 480000, unit: 'each' },
          { model: 'Vertiv Liebert GXT5 3kVA', price: 58000, unit: 'each' }, { model: 'Vertiv Liebert GXT5 6kVA', price: 110000, unit: 'each' }, { model: 'Vertiv Liebert APM 10kVA', price: 260000, unit: 'each' }, { model: 'Vertiv Liebert APM 20kVA', price: 450000, unit: 'each' } ] },
        // ---- Software: one-time perpetual licenses (sw layout, no term) ----
        ws: { label: 'Windows Server', icon: 'server-cog', qtyLabel: 'Quantity', subscription: false, sw: true, items: [
          { model: 'Windows Server Standard', price: 4500, unit: 'per 2-core pack' }, { model: 'Windows Server Datacenter', price: 26000, unit: 'per 2-core pack' },
          { model: 'User CAL', price: 1400, unit: 'per CAL' }, { model: 'Device CAL', price: 1200, unit: 'per CAL' } ] },
        // ---- Software: per-unit-per-year subscriptions (term applies) ----
        backup: { label: 'Backup & DR', icon: 'database-backup', qtyLabel: 'Instances', subscription: true, items: [
          { model: 'Veeam Data Platform', price: 18000, unit: 'per instance/yr' }, { model: 'Commvault Cloud', price: 22000, unit: 'per instance/yr' } ] },
        m365: { label: 'Microsoft 365', icon: 'briefcase', qtyLabel: 'Users', subscription: true, items: [
          { model: 'M365 Business Standard', price: 5600, unit: 'per user/yr' }, { model: 'M365 Business Premium', price: 9800, unit: 'per user/yr' }, { model: 'Microsoft 365 E3', price: 15600, unit: 'per user/yr' } ] },
        virt: { label: 'Virtualization', icon: 'layers', qtyLabel: 'Cores / sockets', subscription: true, items: [
          { model: 'VMware vSphere Standard', price: 3000, unit: 'per core/yr' }, { model: 'VMware vSphere Foundation', price: 5000, unit: 'per core/yr' }, { model: 'VMware Cloud Foundation', price: 9000, unit: 'per core/yr' },
          { model: 'Nutanix NCI Starter', price: 2500, unit: 'per core/yr' }, { model: 'Nutanix NCI Pro', price: 4200, unit: 'per core/yr' }, { model: 'Nutanix NCI Ultimate', price: 6500, unit: 'per core/yr' },
          { model: 'Proxmox VE Basic', price: 9000, unit: 'per socket/yr' }, { model: 'Proxmox VE Premium', price: 35000, unit: 'per socket/yr' } ] },
        endpoint: { label: 'Endpoint Security', icon: 'shield-check', qtyLabel: 'Endpoints', subscription: true, items: [
          { model: 'CrowdStrike Falcon Go (EPP)', price: 1200, unit: 'per endpoint/yr' }, { model: 'CrowdStrike Falcon Enterprise (EDR)', price: 2200, unit: 'per endpoint/yr' }, { model: 'CrowdStrike Falcon Complete (XDR)', price: 3200, unit: 'per endpoint/yr' },
          { model: 'Trend Apex One (EPP)', price: 950, unit: 'per endpoint/yr' }, { model: 'Trend Vision One EDR', price: 1700, unit: 'per endpoint/yr' }, { model: 'Trend Vision One XDR', price: 2600, unit: 'per endpoint/yr' } ] },
        nac: { label: 'NAC', icon: 'fingerprint', qtyLabel: 'Endpoints', subscription: true, items: [
          { model: 'Cisco ISE (license)', price: 450, unit: 'per endpoint/yr' }, { model: 'Aruba ClearPass (license)', price: 380, unit: 'per endpoint/yr' } ] },
        dlp: { label: 'DLP', icon: 'file-lock-2', qtyLabel: 'Users', subscription: true, items: [
          { model: 'Forcepoint Endpoint', price: 900, unit: 'per user/yr' }, { model: 'Forcepoint Network', price: 1100, unit: 'per user/yr' }, { model: 'Forcepoint Endpoint + Network', price: 1700, unit: 'per user/yr' },
          { model: 'Trellix Endpoint', price: 800, unit: 'per user/yr' }, { model: 'Trellix Network', price: 1000, unit: 'per user/yr' }, { model: 'Trellix Endpoint + Network', price: 1500, unit: 'per user/yr' } ] },
        esec: { label: 'Email & SASE', icon: 'mail-check', qtyLabel: 'Users', subscription: true, items: [
          { model: 'Mimecast Email Security', price: 1100, unit: 'per user/yr' }, { model: 'Proofpoint Email Protection', price: 1300, unit: 'per user/yr' },
          { model: 'Zscaler Internet Access (ZIA)', price: 2400, unit: 'per user/yr' }, { model: 'Netskope Intelligent SSE', price: 2100, unit: 'per user/yr' } ] },
        captive: { label: 'Captive portal', icon: 'log-in', qtyLabel: 'Sites', subscription: true, items: [
          { model: 'Aruba ClearPass Guest', price: 60000, unit: 'per site/yr' }, { model: 'Cisco ISE Guest', price: 75000, unit: 'per site/yr' } ] },
        siem: { label: 'Logging / SIEM', icon: 'scroll-text', qtyLabel: 'GB/day', subscription: true, items: [
          { model: 'Splunk Enterprise Security', price: 60000, unit: 'per GB/day/yr' }, { model: 'Microsoft Sentinel', price: 32000, unit: 'per GB/day/yr' } ] }
      };

      function cfgFor(key) {
        var ov = P[key] && P[key].pricelist;
        var d = DEFAULTS[key];
        if (ov && ov.items) return ov;                                   // full override
        if (ov && ov.length && d) { return { label: d.label, icon: d.icon, qtyLabel: d.qtyLabel, subscription: d.subscription, sw: d.sw, items: ov }; }
        return d || null;
      }

      function row(label, value) {
        return '<div class="flex justify-between"><span class="text-muted-foreground">' + label + '</span><span class="tabular-nums">' + value + '</span></div>';
      }
      function field(label, controlHtml) {
        return '<div class="grid gap-1.5"><label class="label">' + label + '</label>' + controlHtml + '</div>';
      }
      function selectHtml(role, opts) {
        return '<select class="select" data-role="' + role + '">' +
          opts.map(function (o) { return '<option value="' + o[0] + '"' + (o[2] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>';
      }
      var TERM_OPTS = [['1', '1 year'], ['3', '3 years', true], ['5', '5 years']];
      var SLA_OPTS  = [['nbd', 'NBD (Next Business Day)', true], ['8x5x4', '8×5×4'], ['24x7x4', '24×7×4']];
      var LOC_OPTS  = [['bkk', 'Bangkok / metro', true], ['upcountry', 'Upcountry']];

      function mount(host) {
        var key = host.getAttribute('data-pricelist');
        var cfg = cfgFor(key);
        if (!cfg || !cfg.items || !cfg.items.length) return;
        var items = cfg.items, sub = !!cfg.subscription, isSw = sub || cfg.sw === true;
        var qtyLabel = cfg.qtyLabel || 'Quantity';
        var sowOpts = (isSw ? SW_SOW : HW_SOW);
        var sowSelect = [['basic', sowOpts.basic], ['standard', sowOpts.standard, true], ['complex', sowOpts.complex]];

        var skuField = field('SKU',
          '<select class="select" data-role="model">' +
            items.map(function (it, i) { return '<option value="' + i + '">' + it.model + ' — ' + thb(it.price) + (it.unit ? ' ' + it.unit : '') + '</option>'; }).join('') +
          '</select>');
        var qtyField = field(qtyLabel, '<input type="number" min="1" value="1" class="input" data-role="qty" />');

        var optionFields;
        if (isSw) {
          optionFields = skuField + qtyField +
            (sub ? field('Term', selectHtml('term', TERM_OPTS)) : '') +
            field('SOW scope (onboarding)', selectHtml('sow', sowSelect)) +
            field('Location', selectHtml('loc', LOC_OPTS));
        } else {
          optionFields = skuField + qtyField +
            field('License / MA term', selectHtml('term', TERM_OPTS)) +
            field('SLA tier', selectHtml('sla', SLA_OPTS)) +
            field('SOW scope (implementation)', selectHtml('sow', sowSelect)) +
            field('Location', selectHtml('loc', LOC_OPTS)) +
            '<label class="flex items-center gap-2 self-end pb-2 text-sm">' +
              '<input type="checkbox" class="h-4 w-4 rounded border-border accent-brand-navy" data-role="adv" /> Advanced replacement (RMA)</label>' +
            '<label class="flex items-center gap-2 self-end pb-2 text-sm">' +
              '<input type="checkbox" class="h-4 w-4 rounded border-border accent-brand-navy" data-role="site" checked /> Include site preparation</label>';
        }

        host.innerHTML =
          '<div class="card mt-6">' +
            '<div class="card-header"><div class="card-title">Model &amp; options</div>' +
              '<div class="card-desc">Pick a SKU straight from the price list, then the commercial options.</div></div>' +
            '<div class="card-content grid gap-4 sm:grid-cols-2 lg:grid-cols-3">' + optionFields + '</div>' +
          '</div>' +
          '<div class="mt-6 flex flex-wrap items-baseline justify-between gap-2">' +
            '<h2 class="text-lg font-semibold tracking-tight">Quotation</h2>' +
            '<span class="text-xs text-muted-foreground">THB &middot; incl. 20% buffer</span></div>' +
          '<div class="mt-3 grid gap-4 sm:grid-cols-2" data-role="summary"></div>';

        var q = function (role) { return host.querySelector('[data-role="' + role + '"]'); };
        var modelEl = q('model'), qtyEl = q('qty'), sumEl = q('summary');

        function render() {
          var it = items[Math.max(0, parseInt(modelEl.value, 10) || 0)];
          var qty = Math.max(1, parseInt(qtyEl.value, 10) || 1);
          var sow = q('sow').value, loc = q('loc').value;
          var impl = implFor(key)[sow] * LOC_MULT[loc];
          var rows, descMeta, total;

          if (isSw) {
            var years = sub ? parseInt(q('term').value, 10) : 1;
            var license = it.price * qty * years;
            total = round1k((license + impl) * BUFFER);
            rows = row('License (' + qty + ' × ' + thb(it.price) + ')', thb(license)) +
                   (sub ? row('Term', years + ' yr') : row('License type', 'Perpetual')) +
                   row('Onboarding', thb(impl)) +
                   row('Support', sub ? 'Included in subscription' : 'Included (warranty)');
            descMeta = it.model + ' · ' + qty + (sub ? ' × ' + years + ' yr' : '');
          } else {
            var yrs = parseInt(q('term').value, 10), sla = q('sla').value;
            var adv = q('adv').checked, site = q('site').checked;
            var lic = Math.round(it.price * SUPP_RATE);                 // annual MA per unit
            var device = it.price * qty;
            var sitePrep = site ? SITE_PREP : 0;
            var support = lic * qty * yrs * SLA_MULT[sla] * (adv ? ADV_MULT : 1);
            total = round1k((device + sitePrep + impl + support) * BUFFER);
            rows = row('Device (' + qty + ' × ' + thb(it.price) + ')', thb(device)) +
                   row('Site prep', site ? thb(sitePrep) : '—') +
                   row('Implementation', thb(impl)) +
                   row('Support · ' + yrs + ' yr · ' + SLA_LABEL[sla] + (adv ? ' · Adv. RMA' : ''), thb(support));
            descMeta = it.model + ' · ' + qty + ' ' + (qty > 1 ? 'units' : 'unit');
          }

          sumEl.innerHTML =
            '<div class="card flex flex-col" data-vendor="pricelist">' +
              '<div class="card-header"><div class="flex items-center gap-2">' +
                '<i data-lucide="' + (cfg.icon || 'tag') + '" class="h-4 w-4 text-brand-navy"></i>' +
                '<div class="card-title">' + cfg.label + '</div></div>' +
                '<div class="card-desc pt-0.5">' + descMeta + '</div></div>' +
              '<div class="card-content flex-1 space-y-1.5 text-sm">' + rows + '</div>' +
              '<div class="mt-auto flex flex-col gap-3 border-t border-border p-6 pt-4">' +
                '<div class="flex items-baseline justify-between"><span class="text-sm text-muted-foreground">Est. total</span>' +
                  '<span class="text-xl font-semibold text-brand-navy tabular-nums">' + thb(total) + '</span></div>' +
                '<button class="btn btn-primary w-full" data-select="pricelist">Add to estimate</button></div>' +
            '</div>';
          if (window.lucide) lucide.createIcons();
        }

        host.querySelectorAll('[data-role]').forEach(function (n) {
          if (n.getAttribute('data-role') === 'summary') return;
          ['input', 'change'].forEach(function (ev) { n.addEventListener(ev, render); });
        });
        render();
      }

      document.querySelectorAll('[data-pricelist]').forEach(mount);
    })();
  </script>
