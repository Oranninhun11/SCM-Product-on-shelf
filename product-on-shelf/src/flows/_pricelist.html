        var lt = cfg.licenseTiers;
        function tiersForBrand(brand) { return lt ? ((lt.byBrand && lt.byBrand[brand]) || lt.tiers || []) : []; }
        function licenseOptionsFor(brand) {
          return tiersForBrand(brand).map(function (t, i) {
            return '<option value="' + t.id + '"' + (i === 0 ? ' selected' : '') + '>' + t.name + '</option>'; }).join('');
        }
        // Configured-bundle models carry their own components; their tier + add-on controls derive from the
        // model (rebuilt on model change). Plain models fall back to the family-level cfg.
        function isBundle(it) { return !!(it && it.components && it.components.length); }
        function compsByRole(it, role) { return (it.components || []).filter(function (c) { return c.role === role; }); }
        // Component price = ingested DB price for that part# (bundleCatalog) if present, else mock.
        // `parts` is the per-type map from ReadPath ({ hw, lic_yr, support_yr }); `priceMap` is the
        // legacy flat pricelist-derived map kept as a second live source.
        var priceMap = cfg.priceMap || {};
        var liveParts = cfg.parts || {};
        function liveVal(part, type) {
          var pi = liveParts[String(part || '').toUpperCase()];
          if (!pi) return null;
          if (type) return (pi[type] != null) ? pi[type] : null;
          var v = (pi.hw != null) ? pi.hw : (pi.lic_yr != null ? pi.lic_yr : pi.support_yr);
          return (v != null) ? v : null;
        }
        // → { v: THB, live: true when the DB supplied it (vs the in-code mock fallback) }
        function resolve(part, fallback, type) {
          var lv = liveVal(part, type);
          if (lv != null) return { v: lv, live: true };
          var pm = priceMap[String(part || '').toUpperCase()];
          if (pm != null) return { v: pm, live: true };
          return { v: fallback || 0, live: false };
        }
        function priceOf(part, fallback, type) { return resolve(part, fallback, type).v; }
        function addonCheckbox(name, price, checked) {
          return '<label class="flex items-center gap-2 text-sm">' +
            '<input type="checkbox" class="h-4 w-4 rounded border-border accent-brand-navy" data-role="addon"' + (checked ? ' checked' : '') +
            ' data-addon-price="' + price + '" data-addon-name="' + String(name).replace(/"/g, '&quot;') + '" /> ' +
            name + ' (' + thb(price) + ')</label>';
        }
        // Inner HTML for the license/subscription tier field (empty string when the model/family has none).
        function tierInner(it, brand) {
          var opts;
          if (isBundle(it)) {
            opts = compsByRole(it, 'dna').map(function (c, i) { return '<option value="' + c.id + '"' + (i === 0 ? ' selected' : '') + '>' + c.name + '</option>'; }).join('');
          } else { if (!lt) return ''; opts = licenseOptionsFor(brand); }
          if (!opts) return '';
          return '<div class="grid gap-1.5"><label class="label">' + ((lt && lt.label) || 'Subscription') + '</label>' +
            '<select class="select" data-role="lic-tier">' + opts + '</select></div>';
        }
        // Inner HTML for the add-ons block (empty string when none).
        function addonsInner(it) {
          var list = isBundle(it)
            ? compsByRole(it, 'addon').map(function (c) { return addonCheckbox(c.name || c.part, priceOf(c.part, c.price), !!c.on); }).join('')
            : (cfg.addons || []).map(function (a) { return addonCheckbox(a.name, a.price, false); }).join('');
          if (!list) return '';
          return '<div class="grid gap-1.5 sm:col-span-2 lg:col-span-3"><span class="label">Add-ons</span>' +
            '<div class="flex flex-wrap gap-x-6 gap-y-2 pt-1">' + list + '</div></div>';
        }
        // Implementation + Support are individually toggleable on EVERY hardware price list (default on),
        // so every product reads the same as firewall/switch. (Software/accessory layouts don't apply.)
        var toggleField =
          '<label class="flex items-center gap-2 self-end pb-2 text-sm">' +
            '<input type="checkbox" class="h-4 w-4 rounded border-border accent-brand-navy" data-role="impl-on" checked /> Include implementation</label>' +
          '<label class="flex items-center gap-2 self-end pb-2 text-sm">' +
            '<input type="checkbox" class="h-4 w-4 rounded border-border accent-brand-navy" data-role="support-on" checked /> Include support</label>';

        var optionFields;
        if (accessory) {
          optionFields = brandField + modelField + qtyField;
        } else if (isSw) {
          // Software: same Implementation/Support toggles as hardware, but NO site prep / SLA / RMA.
          optionFields = brandField + modelField + qtyField +
            (sub ? field('Term', selectHtml('term', TERM_OPTS)) : '') +
            field('SOW scope (onboarding)', selectHtml('sow', sowSelect)) +
            field('Location', selectHtml('loc', LOC_OPTS)) +
            toggleField;
        } else {
          // cfg-tier / cfg-addons are display:contents wrappers refilled per selected model (bundle-aware).
          optionFields = brandField + modelField + qtyField +
            '<div data-role="cfg-tier" style="display:contents"></div>' +
            field('License / MA term', selectHtml('term', TERM_OPTS)) +
            field('SLA tier', selectHtml('sla', SLA_OPTS)) +
            field('SOW scope (implementation)', selectHtml('sow', sowSelect)) +
            field('Location', selectHtml('loc', LOC_OPTS)) +
            toggleField +
            '<label class="flex items-center gap-2 self-end pb-2 text-sm">' +
              '<input type="checkbox" class="h-4 w-4 rounded border-border accent-brand-navy" data-role="adv" /> Advanced replacement (RMA)</label>' +
            '<label class="flex items-center gap-2 self-end pb-2 text-sm">' +
              '<input type="checkbox" class="h-4 w-4 rounded border-border accent-brand-navy" data-role="site" checked /> Include site preparation</label>' +
            '<div data-role="cfg-addons" style="display:contents"></div>';
        }

        var pickDesc = accessory
          ? 'Pick a brand and model from the price list, then the quantity.'
          : 'Pick a brand and model from the price list, then the commercial options.';
        host.innerHTML =
          '<div class="card mt-6">' +
            '<div class="card-header"><div class="card-title">Model &amp; options</div>' +
              '<div class="card-desc">' + pickDesc + '</div></div>' +
            '<div class="card-content grid gap-4 sm:grid-cols-2 lg:grid-cols-3">' + optionFields + '</div>' +
          '</div>' +
          '<div class="mt-6 flex flex-wrap items-baseline justify-between gap-2">' +
            '<h2 class="text-lg font-semibold tracking-tight">Quotation</h2>' +
            '<span class="text-xs text-muted-foreground">THB &middot; incl. 20% buffer</span></div>' +
          '<div class="mt-3 grid gap-4 sm:grid-cols-2" data-role="summary"></div>';

        var q = function (role) { return host.querySelector('[data-role="' + role + '"]'); };
        var modelEl = q('model'), qtyEl = q('qty'), sumEl = q('summary');

        function render() {
          var it = items[Math.max(0, parseInt(modelEl.value, 10) || 0)];
          var qty = Math.max(1, parseInt(qtyEl.value, 10) || 1);
          var rows, descMeta, total, detailHtml = '';   // detailHtml = read-only SKU BoM expander (bundle models only)

          if (accessory) {
            var devOnly = it.price * qty;
            total = round1k(devOnly * BUFFER);
            rows = row('Device (' + qty + ' × ' + thb(it.price) + ')', thb(devOnly));
            descMeta = it.model + ' · ' + qty + ' ' + (qty > 1 ? 'units' : 'unit');
          } else if (isSw) {
            var sow = q('sow').value, loc = q('loc').value;
            var implOn = q('impl-on') ? q('impl-on').checked : true;     // toggle (default on); no site prep for software
            var supportOn = q('support-on') ? q('support-on').checked : true;
            var impl = implOn ? implFor(key)[sow] * LOC_MULT[loc] : 0;
            var years = sub ? parseInt(q('term').value, 10) : 1;
            var license = it.price * qty * years;
            total = round1k((license + impl) * BUFFER);
            rows = row('License (' + qty + ' × ' + thb(it.price) + ')', thb(license)) +
                   (sub ? row('Term', years + ' yr') : row('License type', 'Perpetual')) +
                   row('Implementation', implOn ? thb(impl) : '—') +
                   row('Support', supportOn ? (sub ? 'Included in subscription' : 'Included (warranty)') : '—');
            descMeta = it.model + ' · ' + qty + (sub ? ' × ' + years + ' yr' : '');
          } else {
            var sow = q('sow').value, loc = q('loc').value;
            var yrs = parseInt(q('term').value, 10), sla = q('sla').value;
            var adv = q('adv').checked, site = q('site').checked;
            var implOn = q('impl-on') ? q('impl-on').checked : true;    // toggle when componentToggles; else always on
            var supportOn = q('support-on') ? q('support-on').checked : true;
            var bundle = isBundle(it);

            // which add-on checkboxes are ticked right now (keyed by their name)
            var checkedAddon = {};
            host.querySelectorAll('[data-role="addon"]').forEach(function (cb) { if (cb.checked) checkedAddon[cb.getAttribute('data-addon-name')] = true; });

            // --- Device: ONE merged line. Bundle = sum(device SKUs) + ticked hardware add-ons; plain = list price.
            //     Plain-model add-ons stay their own lines (unchanged); bundle add-ons fold into Device + show in detail.
            var perUnit, addonRows = '', addonTotal = 0, detailComps = [], liveCount = 0;
            if (bundle) {
              perUnit = 0;
              compsByRole(it, 'device').forEach(function (c) {
                var rz = resolve(c.part, c.price); perUnit += rz.v; if (rz.live) liveCount++;
                detailComps.push({ c: c, on: true, live: rz.live }); });
              compsByRole(it, 'addon').forEach(function (c) {
                var rz = resolve(c.part, c.price); var on = !!checkedAddon[c.name || c.part];
                if (on) perUnit += rz.v; if (rz.live) liveCount++;
                detailComps.push({ c: c, on: on, live: rz.live }); });
            } else {
              perUnit = it.price;
              host.querySelectorAll('[data-role="addon"]').forEach(function (cb) {
                if (cb.checked) { var ap = Number(cb.getAttribute('data-addon-price')) || 0; addonTotal += ap; addonRows += row(cb.getAttribute('data-addon-name'), thb(ap)); } });
            }
            var device = perUnit * qty;

            // --- Subscription tier: bundle picks a DNA component; plain uses the family tier list (brand-aware).
            var subAmt = 0, subRow = '', chosenDna = null, dnaLive = false;
            var tierEl = q('lic-tier');
            if (bundle) {
              var dnas = compsByRole(it, 'dna');
              chosenDna = dnas.filter(function (c) { return c.id === (tierEl && tierEl.value); })[0] || dnas[0];
              if (chosenDna) { var rzd = resolve(chosenDna.part, chosenDna.price); dnaLive = rzd.live; if (rzd.live) liveCount++;
                var syb = chosenDna.perYear ? yrs : 1; subAmt = rzd.v * qty * syb;
                subRow = row('Subscription · ' + chosenDna.name + (chosenDna.perYear ? ' · ' + syb + ' yr' : ''), thb(subAmt)); }
            } else if (lt) {
              var brandNow = q('brand') ? q('brand').value : brands[0];
              var tier = tiersForBrand(brandNow).filter(function (t) { return t.id === (tierEl && tierEl.value); })[0] || tiersForBrand(brandNow)[0];
              if (tier) { var sy = lt.perYear ? yrs : 1; subAmt = tier.price * qty * sy;
                subRow = row((lt.label || 'Subscription') + ' · ' + tier.name + (lt.perYear ? ' · ' + sy + ' yr' : ''), thb(subAmt)); }
            }

            // --- Support: bundle uses the support SKU (e.g. SmartNet); plain ≈ 10% of list per unit/yr.
            // The support SKU itself is rarely quoted under its own part# — SmartNet/Net.Cover contracts
            // are aliased onto the parent device sku as support_yr — so fall back to the chassis part's
            // ingested support_yr before the mock price.
            var supComp = bundle ? compsByRole(it, 'support')[0] : null, supLive = false;
            var supBase;
            if (supComp) {
              var rzs = resolve(supComp.part, supComp.price);
              if (!rzs.live && it.components[0]) {
                var ds = liveVal(it.components[0].part, 'support_yr');
                if (ds != null) rzs = { v: ds, live: true };
              }
              supBase = rzs.v; supLive = rzs.live; if (rzs.live) liveCount++;
            } else {
              supBase = Math.round(perUnit * SUPP_RATE);
            }
            var sitePrep = site ? SITE_PREP : 0;
            var impl = implOn ? implFor(key)[sow] * LOC_MULT[loc] : 0;
            var support = supportOn ? supBase * qty * yrs * SLA_MULT[sla] * (adv ? ADV_MULT : 1) : 0;

            total = round1k((device + subAmt + addonTotal + sitePrep + impl + support) * BUFFER);
            var devLabel = bundle ? ('Device · ' + it.components[0].part + ' (' + qty + ' × ' + thb(perUnit) + ')')
                                  : ('Device (' + qty + ' × ' + thb(perUnit) + ')');
            rows = row(devLabel, thb(device)) +
                   subRow +
                   addonRows +
                   row('Site prep', site ? thb(sitePrep) : '—') +
                   row('Implementation', implOn ? thb(impl) : '—') +
                   row('Support · ' + yrs + ' yr · ' + SLA_LABEL[sla] + (adv ? ' · Adv. RMA' : ''), supportOn ? thb(support) : '—');
            descMeta = it.model + ' · ' + qty + ' ' + (qty > 1 ? 'units' : 'unit') +
              (bundle && liveCount ? ' <span class="rounded-full bg-emerald-50 px-2 py-0.5 text-[10px] font-medium text-emerald-700">' +
                liveCount + ' live price' + (liveCount > 1 ? 's' : '') + '</span>' : '');

            // --- Read-only SKU detail (the merged-into-Device BoM + the subscription/support SKUs) ---
            if (bundle) {
              var lines = detailComps.map(function (d) { return { part: d.c.part, desc: d.c.desc, price: priceOf(d.c.part, d.c.price), on: d.on, live: d.live }; });
              if (chosenDna) lines.push({ part: chosenDna.part, desc: chosenDna.desc, price: priceOf(chosenDna.part, chosenDna.price), on: true, live: dnaLive });
              if (supComp) lines.push({ part: supComp.part, desc: supComp.desc, price: supBase, on: supportOn, live: supLive });
              var nOn = lines.filter(function (l) { return l.on; }).length;
              detailHtml =
                '<div class="border-t border-border px-6 py-3 text-sm">' +
                  '<button type="button" class="flex w-full items-center justify-between text-muted-foreground hover:text-foreground" data-role="bom-toggle" aria-label="Toggle SKU detail">' +
                    '<span>View SKU detail · ' + nOn + ' lines</span><i data-lucide="chevron-down" class="h-4 w-4"></i></button>' +
                  '<div class="mt-2 hidden space-y-1" data-role="bom-detail">' +
                    lines.map(function (l) {
                      return '<div class="flex items-baseline justify-between gap-3' + (l.on ? '' : ' opacity-40 line-through') + '">' +
                        '<span class="font-mono text-xs">' + l.part +
                          (l.live ? ' <span class="inline-block h-1.5 w-1.5 rounded-full bg-emerald-500" title="live DB price"></span>' : '') + '</span>' +
                        '<span class="flex-1 px-2 text-xs text-muted-foreground">' + l.desc + '</span>' +
                        '<span class="tabular-nums text-xs">' + (l.price ? thb(l.price) : 'incl.') + '</span></div>'; }).join('') +
                  '</div></div>';
            }
          }

          sumEl.innerHTML =
            '<div class="card flex flex-col" data-vendor="pricelist">' +
              '<div class="card-header"><div class="flex items-center gap-2">' +
                '<i data-lucide="' + (cfg.icon || 'tag') + '" class="h-4 w-4 text-brand-navy"></i>' +
                '<div class="card-title">' + cfg.label + '</div></div>' +
                '<div class="card-desc pt-0.5">' + descMeta + '</div></div>' +
              '<div class="card-content flex-1 space-y-1.5 text-sm">' + rows + '</div>' +
              detailHtml +
              '<div class="mt-auto flex flex-col gap-3 border-t border-border p-6 pt-4">' +
                '<div class="flex items-baseline justify-between"><span class="text-sm text-muted-foreground">Est. total</span>' +
                  '<span class="text-xl font-semibold text-brand-navy tabular-nums">' + thb(total) + '</span></div>' +
                '<button class="btn btn-primary w-full" data-select="pricelist">Add to estimate</button></div>' +
            '</div>';
          if (window.lucide) lucide.createIcons();
        }

        // Refill the per-model tier + add-on controls for the current model/brand (bundle-aware).
        function syncModelConfig() {
          var it = items[Math.max(0, parseInt(modelEl.value, 10) || 0)];
          var brand = q('brand') ? q('brand').value : brands[0];
          var tEl = q('cfg-tier'), aEl = q('cfg-addons');
          if (tEl) tEl.innerHTML = tierInner(it, brand);
          if (aEl) aEl.innerHTML = addonsInner(it);
        }

        // Delegated change/input — covers controls injected dynamically by syncModelConfig.
        ['input', 'change'].forEach(function (ev) {
          host.addEventListener(ev, function (e) {
            var r = e.target && e.target.getAttribute ? e.target.getAttribute('data-role') : null;
            if (r === 'summary' || r === 'cfg-tier' || r === 'cfg-addons') return;
            if (r === 'brand') { modelEl.innerHTML = modelOptionsFor(e.target.value); syncModelConfig(); render(); return; }
            if (r === 'model') { syncModelConfig(); render(); return; }
            render();
          });
        });

        // BoM detail expander (delegated; the summary card is rebuilt on every render).
        host.addEventListener('click', function (e) {
          var t = e.target.closest ? e.target.closest('[data-role="bom-toggle"]') : null;
          if (!t) return;
          var d = t.parentElement.querySelector('[data-role="bom-detail"]');
          if (!d) return;
          var open = d.classList.toggle('hidden') === false;
          var ic = t.querySelector('svg, i'); if (ic) ic.style.transform = open ? 'rotate(180deg)' : '';
        });

        syncModelConfig();
        render();
      }

      document.querySelectorAll('[data-pricelist]').forEach(mount);
    })();
  </script>
